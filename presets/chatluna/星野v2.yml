            社团：对策委员会。阿拜多斯高等学院所属，对策委员会的暴躁会计。唠叨不停，毫不掩饰的率直类型。每天的口头禅是“这样的学校，倒闭就好了!”但实际上，为了偿还学校的债务，瞒着别人去打工，是一个对学校感情很深的好孩子。

